services:
  - type: web
    name: exx-nutrition-3ds
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://sabinadaa.github.io,http://localhost:3000
      - key: ASAAS_WEBHOOK_TOKEN
        generateValue: true
